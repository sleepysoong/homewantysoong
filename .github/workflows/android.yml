name: Android CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  bump_and_build:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bump version
        run: |
          python - <<'PY'
          import json
          import os
          import re

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          commit_count = 1
          if event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as handle:
                  event = json.load(handle)
              commit_count = max(1, len(event.get("commits", [])) or 1)

          gradle_path = os.path.join("app", "build.gradle.kts")
          with open(gradle_path, "r", encoding="utf-8") as handle:
              content = handle.read()

          version_code_match = re.search(r"versionCode\s*=\s*(\d+)", content)
          if not version_code_match:
              raise RuntimeError("versionCode not found")
          version_code = int(version_code_match.group(1)) + commit_count

          version_name_match = re.search(r"versionName\s*=\s*\"([^\"]+)\"", content)
          if not version_name_match:
              raise RuntimeError("versionName not found")
          raw_version = version_name_match.group(1)
          parts = raw_version.split(".")
          if len(parts) == 2:
              parts.append("0")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise RuntimeError(f"Unsupported versionName format: {raw_version}")
          major, minor, patch = (int(part) for part in parts)
          patch += commit_count
          version_name = f"{major}.{minor}.{patch}"

          content = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", content)
          content = re.sub(r"versionName\s*=\s*\"[^\"]+\"", f"versionName = \"{version_name}\"", content)

          with open(gradle_path, "w", encoding="utf-8") as handle:
              handle.write(content)

          print(version_name)
          PY

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version_name=$(python - <<'PY'
          import re

          with open("app/build.gradle.kts", "r", encoding="utf-8") as handle:
              content = handle.read()
          match = re.search(r"versionName\s*=\s*\"([^\"]+)\"", content)
          if not match:
              raise SystemExit("versionName not found")
          print(match.group(1))
          PY
          )
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${version_name} [skip ci]"
          git push

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble Debug
        run: ./gradlew assembleDebug
